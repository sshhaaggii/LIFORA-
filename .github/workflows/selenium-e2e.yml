name: Selenium Web E2E Tests with Smart Dynamic Discovery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  selenium-web-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Dependencies & Fix Bin Permissions
        run: |
          cd testing/selenium-web
          npm install
          chmod -R +x node_modules/.bin || true

      - name: 4. Run Selenium Web E2E Tests (Headless Chrome & Dynamic Route/Form Discovery)
        run: |
          cd testing/selenium-web
          chmod -R +x node_modules/.bin || true
          HEADLESS=true BROWSER=chrome npm test

      - name: 5. Generate Excel Report
        if: always()
        run: |
          cd testing/selenium-web
          npm run report:excel || true

      - name: 6. Upload Artifacts (Excel, Mochawesome HTML, Screenshots, Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_Web_E2E_Reports
          path: |
            testing/selenium-web/reports/excel/E2E_Report.xlsx
            testing/selenium-web/reports/html/
            testing/selenium-web/reports/failures/
            testing/selenium-web/reports/logs/
