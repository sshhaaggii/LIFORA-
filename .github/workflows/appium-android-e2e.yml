name: Appium Android E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  appium-android-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Appium 2.x & Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 6. Install Framework Dependencies
        run: |
          cd testing/appium-mobile
          npm install

      - name: 7. Run Appium Mobile E2E Tests
        run: |
          cd testing/appium-mobile
          npm test || true

      - name: 8. Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium_Mobile_E2E_Reports
          path: |
            testing/appium-mobile/reports/excel/React_Native_E2E_Report.xlsx
            testing/appium-mobile/reports/html/
            testing/appium-mobile/reports/failures/
            testing/appium-mobile/reports/logs/
